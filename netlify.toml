# Hosting principal: Netlify (https://climont.es)
# Copia de respaldo: GitHub Pages (https://respaldo.climont.es)
#
# Este archivo lo usa Netlify tanto si algún día se conecta el repositorio
# para compilar en la nube como si se despliega el dist/ ya compilado.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--no-audit --no-fund"

# Dominio canónico: www redirige al apex. Netlify ya redirige los alias del
# sitio, pero la regla explícita lo deja garantizado aunque cambie el panel.
[[redirects]]
  from = "https://www.climont.es/*"
  to = "https://climont.es/:splat"
  status = 301
  force = true
